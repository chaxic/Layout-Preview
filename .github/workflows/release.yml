name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches package.json version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Package extension
        run: cd extension && zip -r "../layout-preview-extension-${GITHUB_REF_NAME}.zip" . -x README.md
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "layout-preview-extension-${GITHUB_REF_NAME}.zip" --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
